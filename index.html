<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta 
    name="viewport" 
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#05070c">
  <meta name="description" content="CLOUT AI - Internet-powered AI assistant">
  <meta name="author" content="Gokah Israel Ewoenam">
  <meta name="color-scheme" content="dark light">

  <title>CLOUT AI</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
</head>

<body>
  <!-- ==========================================
       APPLICATION
       ========================================== -->
  <div class="app" role="application" aria-label="CLOUT AI Chat Application">

    <!-- ======================================
         HEADER
         ====================================== -->
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">C</div>
        <div class="brand-text">
          <h1>CLOUT AI</h1>
          <p>
            <span class="online-dot" aria-label="Online"></span>
            Internet AI
          </p>
        </div>
      </div>

      <button 
        id="aboutButton" 
        class="header-button" 
        type="button" 
        aria-haspopup="dialog"
        aria-controls="aboutModal"
      >
        About
      </button>
    </header>

    <!-- ======================================
         CHAT
         ====================================== -->
    <main id="chatBox" class="chat-box" role="log" aria-live="polite" aria-label="Chat messages">
      <!-- Messages will be added by app.js -->
    </main>

    <!-- ======================================
         INPUT
         ====================================== -->
    <form id="chatForm" class="input-area" autocomplete="off">
      <label for="messageInput" class="visually-hidden">Message input</label>
      <input 
        id="messageInput" 
        name="message"
        type="text" 
        placeholder="Ask CLOUT anything..." 
        autocomplete="off" 
        spellcheck="true"
        required
        aria-label="Ask CLOUT anything"
      >

      <button 
        id="sendButton" 
        class="send-button" 
        type="submit" 
        aria-label="Send message"
      >
        ➤
      </button>
    </form>
  </div>

  <!-- ==========================================
       ABOUT MODAL
       ========================================== -->
  <div id="aboutModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="aboutTitle" hidden>
    <div class="about-card">
      <button 
        id="closeAbout" 
        class="close-button" 
        type="button"
        aria-label="Close about dialog"
      >
        ×
      </button>

      <div class="about-logo" aria-hidden="true">C</div>

      <h2 id="aboutTitle">CLOUT AI</h2>

      <p class="version">Internet AI • Version 1.0</p>

      <div class="divider" role="separator"></div>

      <p class="label">CREATED BY</p>

      <h3>Gokah Israel Ewoenam</h3>

      <p class="creator-info">
        18 years old • Ghanaian • Ewe
        <br>
        Akatsi, Volta Region, Ghana
      </p>

      <div class="creator-badge" aria-label="From Ghana">
        🇬🇭 Ghana
      </div>

      <div class="divider" role="separator"></div>

      <div class="about-grid">
        <div>
          <span>AI</span>
          <strong>Internet</strong>
        </div>

        <div>
          <span>STORAGE</span>
          <strong>None</strong>
        </div>

        <div>
          <span>PLATFORM</span>
          <strong>Mobile</strong>
        </div>
      </div>

      <p class="copyright">© 2026 Gokah Israel Ewoenam</p>
    </div>
  </div>

  <!-- ==========================================
       JAVASCRIPT
       ========================================== -->
  <script src="api.js" defer></script>
  <script src="app.js" defer></script>
</body>
  </html>
